<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Logo de mano humana y pata de perro chocando los cinco">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171C25"/>
      <stop offset="1" stop-color="#0D1118"/>
